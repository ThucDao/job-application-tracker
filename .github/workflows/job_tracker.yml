name: 🎯 Daily Job Tracker

on:
  schedule:
    # 7:00 AM Eastern Time every day
    - cron: "0 12 * * *"   
  workflow_dispatch:            

jobs:
  track-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2  # Upgraded to latest minor version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.4.0  # Upgraded to latest minor version
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job tracker
        env:
          GEMINI_API_KEY:               ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID:        ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GMAIL_SENDER:                 ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD:           ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:              ${{ secrets.RECIPIENT_EMAIL }}
          USER_PROFILE:                 ${{ secrets.USER_PROFILE }}
        run: python job_tracker.py
