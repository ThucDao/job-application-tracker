# EXAMPLE SECRETS FILE
# Copy this to .streamlit/secrets.toml and fill in your values
# DO NOT commit this file to GitHub - add .streamlit/ to .gitignore

# Your Google Sheets URL (get this from Share → Copy link)
sheet_url = "https://docs.google.com/spreadsheets/d/1A_B_C_D_E_F_G_H_I_J_K_L_M_N_O_P_Q_R_S_T_U_V_W_X_Y_Z/edit#gid=0"

# Admin email addresses (full access with editing)
admin_emails = ["your.email@gmail.com"]

# Family members or trusted people (read-only access, can view but not edit)
# Can be a single email or a list
trusted_viewers = [
    "spouse@gmail.com",
    "brother@example.com"
]

# User passwords for authentication
# Each user (admin or trusted_viewer) must have a password here
# Passwords are stored securely in Streamlit Secrets, NOT in source code
[user_passwords]
your.email@gmail.com = "your_secure_admin_password"
spouse@gmail.com = "trusted_viewer_password"
brother@example.com = "another_trusted_viewer_password"

# Google Cloud Service Account Credentials
# Get this JSON from: Google Cloud Console → Service Accounts → Keys → Create key (JSON)
[gcp_service_account]
type = "service_account"
project_id = "my-project-id-12345"
private_key_id = "abc123def456ghi789jkl"
private_key = "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC/...(very long string)\n-----END PRIVATE KEY-----\n"
client_email = "job-tracker-app@my-project-id-12345.iam.gserviceaccount.com"
client_id = "1234567890123456789"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/job-tracker-app%40my-project-id-12345.iam.gserviceaccount.com"
